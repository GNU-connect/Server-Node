name: Batch CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/api/batch/src/**'
      - 'services/api/batch/package.json'
      - 'services/api/batch/pnpm-lock.yaml'
      - 'services/api/batch/Dockerfile'
      - 'services/api/batch/.dockerignore'
      - 'services/api/batch/tsconfig*.json'
      - 'services/api/batch/nest-cli.json'
      - 'services/api/docker-compose.yml'
      - '.github/workflows/batch-cd.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/connectgnu/api
  IMAGE_NAME: connect-gnu-batch

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/batch-ci.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: services/api/batch
          target: prod
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=batch
          cache-to: type=gha,mode=max,scope=batch

  deploy:
    name: Deploy to API Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.API_SSH_USERNAME }}
          key: ${{ secrets.API_SSH_PRIVATE_KEY }}
          source: services/api/docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.API_SSH_USERNAME }}
          key: ${{ secrets.API_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}

            docker compose pull batch
            docker compose up -d --no-deps batch

            cid=$(docker compose ps -q batch)
            if [ -z "$cid" ]; then
              echo "batch container not found"
              docker compose ps
              exit 1
            fi

            # 헬스체크 엔드포인트가 없으므로 기동 후 재시작 없이 running 상태를 유지하는지 확인
            sleep 20
            status=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
            if [ "$status" != running ] || [ "$restarts" != 0 ]; then
              echo "batch status: $status, restarts: $restarts"
              docker compose logs --tail 100 batch
              exit 1
            fi

            docker image prune -f
