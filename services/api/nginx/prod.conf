upstream app {
  server app:3000;
}

# HTTP
server {
  listen 80;
  server_name api.connectgnu.kro.kr admin.connectgnu.kro.kr;
  underscores_in_headers on;

  # Let's Encrypt 인증서 발급
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # HTTP → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name api.connectgnu.kro.kr;
  underscores_in_headers on;

  # SSL 인증서
  ssl_certificate /etc/letsencrypt/live/api.connectgnu.kro.kr-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.connectgnu.kro.kr-0001/privkey.pem;

  # API 경로 (Swagger /api/api-docs 포함)
  location /api {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
  }

  # 그 외 경로 차단
  location / {
    deny all;
  }
}

# HTTPS - 어드민 웹
server {
  listen 443 ssl;
  http2 on;
  server_name admin.connectgnu.kro.kr;
  underscores_in_headers on;

  # SSL 인증서
  ssl_certificate /etc/letsencrypt/live/admin.connectgnu.kro.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.connectgnu.kro.kr/privkey.pem;

  # admin CD가 releases/<sha>로 올리고 current 링크를 바꾼다
  root /usr/share/nginx/admin/current;
  index index.html;

  # admin API만 같은 출처로 프록시
  location /api/admin/ {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
  }

  # 파일명에 해시가 붙은 빌드 산출물: 오래 캐시하고, 없으면 index로 떨어지지 않게 404
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri =404;
  }

  # SPA: 없는 경로는 index.html, 매번 최신 index를 확인
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri /index.html;
  }
}
