upstream app {
  server app:3000;
}

# HTTP
server {
  listen 80;
  server_name api.connectgnu.kro.kr;
  underscores_in_headers on;

  # Let's Encrypt 인증서 발급
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # HTTP → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name api.connectgnu.kro.kr;
  underscores_in_headers on;

  # SSL 인증서
  ssl_certificate /etc/letsencrypt/live/api.connectgnu.kro.kr-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.connectgnu.kro.kr-0001/privkey.pem;

  # Swagger 경로
  location /api/api-docs {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;

    allow 210.121.177.238;
    deny all;
  }

  # 모니터링 경로
  location /api/metrics {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;

    allow 35.212.243.112;
    deny all;
  }

  # API 경로
  location /api {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
  }

  # 그 외 경로 차단
  location / {
    deny all;
  }
}
