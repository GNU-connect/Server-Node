services:
  nginx:
    image: nginx:1.29.5-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - connect-gnu-network
    depends_on:
      - app

  app:
    build:
      context: ./app
      target: dev
    env_file:
      - .env.local
    volumes:
      - ./app:/app
      - /app/node_modules
    restart: always
    ports:
      - '3000:3000'
    networks:
      - connect-gnu-network

  # 로컬 수집 확인용. `supabase start`로 띄운 DB(54322)에 붙는다.
  # 같은 폴더의 .env(운영 DB 값)가 ${VAR} 치환으로 섞이지 않도록 값을 그대로 적는다.
  batch:
    build:
      context: ./batch
      target: prod
    restart: 'no'
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: '54322'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
    networks:
      - connect-gnu-network

networks:
  connect-gnu-network:
    driver: bridge
